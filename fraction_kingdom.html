<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분수 왕국의 전설</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#fff;background:#101b36}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#334f87,#101b36 65%)}main{max-width:780px;margin:auto;padding:22px 14px 50px}h1{text-align:center;color:#ffe59b;text-shadow:0 3px #674119;font-size:clamp(27px,6vw,42px);margin:10px 0}.sub{text-align:center;color:#d5e4ff}.panel{background:#203459;border:2px solid #647da9;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 12px 25px #07112788}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{background:#101c38;border:1px solid #758db4;border-radius:40px;padding:8px 12px;font-weight:700}.progress{height:14px;border-radius:20px;background:#0b1730;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#5de0b0,#f9d66b);width:0;transition:width .35s}.hero{text-align:center;font-size:90px;line-height:1.3;min-height:125px}.heroName{text-align:center;font-size:22px;font-weight:800;color:#ffe49b}.gear{text-align:center;color:#cddfff;min-height:25px}.question{text-align:center;background:#fdf4d8;color:#26304a;border-radius:18px;padding:22px 8px;margin:18px 0}.question small{font-weight:700;color:#6a6e7b}.equation{font-size:clamp(25px,5.5vw,40px);font-weight:800;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.mixed{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;line-height:1.15;font-size:.65em}.frac span:first-child{border-bottom:2px solid currentColor;min-width:24px;padding:0 3px 3px}.frac span:last-child{padding-top:3px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:13px;padding:15px;font-size:18px;font-weight:800;cursor:pointer;background:#ffd476;color:#312818;box-shadow:0 4px #ad7835}.btn:active{transform:translateY(3px);box-shadow:0 1px #ad7835}.btn.secondary{background:#9cc9f9;box-shadow:0 4px #477ba9}.btn:disabled{opacity:.45;cursor:not-allowed}.inputRow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.field{width:76px;background:white;border:2px solid #879bb9;border-radius:10px;padding:11px;font-size:22px;text-align:center;color:#16213c}.field:focus{outline:3px solid #f5b942}.stack{display:flex;flex-direction:column;gap:6px;align-items:center}.stack .field{width:83px}.line{height:2px;width:90px;background:#283854}.feedback{margin-top:14px;text-align:center;font-weight:800;min-height:26px}.foot{text-align:center;color:#bbcee9;font-size:13px;margin-top:14px}.hidden{display:none!important}.levelup{text-align:center;background:#344c72;border:2px solid #ffd476;border-radius:16px;padding:22px;margin:16px 0}.levelup h2{color:#ffe49b}.summary{text-align:center;font-size:18px;line-height:1.9}.hint{color:#f8e7a4;font-weight:600;text-align:center;margin-top:10px}.rowBtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.rowBtns .btn{min-width:140px}@media(max-width:420px){.panel{padding:14px}.choices{gap:9px}.choices .btn{padding:13px 4px;font-size:17px}.hero{font-size:76px}}
</style></head><body><main><h1>⚔️ 분수 왕국의 전설 👑</h1><p class="sub">대분수 덧셈·뺄셈 30문제에 도전하고 왕이 되세요!</p><section class="panel"><div class="top"><span id="level" class="pill">레벨 1</span><span id="count" class="pill">0 / 30 완료</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="hero" class="hero">🧑</div><div id="heroName" class="heroName">평범한 모험가</div><div id="gear" class="gear">장비: 나무 막대</div><div id="play"><div class="question"><small id="questLabel">퀘스트 1</small><div class="equation" id="equation"></div></div><div id="choiceArea" class="choices"></div><div id="inputArea" class="hidden"><p style="text-align:center;color:#d6e4fc">답을 자연수와 분수로 입력하세요. 정수인 경우 분자는 0으로!</p><div class="inputRow"><div class="stack"><label for="whole">자연수</label><input id="whole" class="field" type="number" min="0" inputmode="numeric" value="0"></div><div class="stack"><label for="num">분자</label><input id="num" class="field" type="number" min="0" inputmode="numeric" placeholder="분자"><div class="line"></div><label for="den">분모</label><input id="den" class="field" type="number" min="1" inputmode="numeric" placeholder="분모"></div></div><div style="text-align:center;margin-top:20px"><button id="submit" class="btn">정답 제출</button></div></div><div id="feedback" class="feedback" aria-live="polite"></div><p id="hint" class="hint"></p></div><div id="levelUp" class="levelup hidden"><h2>✨ LEVEL UP! ✨</h2><div id="levelUpHero" style="font-size:84px"></div><h2 id="levelUpName"></h2><p id="levelUpText"></p><button id="continue" class="btn">다음 퀘스트로 ➜</button></div><div id="finish" class="summary hidden"><h2>🏆 모든 퀘스트 완료!</h2><p>분수 왕국의 왕이 되었습니다!</p><div style="font-size:100px">🤴</div><div id="stats"></div><button id="restart" class="btn">다시 도전하기</button></div></section><div class="foot">1~15번: 4지선다 · 16~30번: 직접 입력 · 틀리면 다시 도전 가능 · 인터넷 연결 불필요</div></main><script>
'use strict';
const heroes=[['🧑','평범한 모험가','나무 막대'],['🪖','견습 병사','훈련용 검과 투구'],['🛡️','정예 기사','방패와 철갑옷'],['⚔️','기사단장','빛나는 검과 망토'],['🏇','전설의 장군','황금 갑옷과 전투 장비'],['🤴','분수 왕국의 왕','왕관과 왕의 지팡이']];
const $=id=>document.getElementById(id);let questions=[],index=0,wrong=0,start=Date.now(),locked=false,attempt=0;
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a||1}function f(n,d){const g=gcd(n,d);return {n:n/g,d:d/g}}function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}function mixed(w,n,d){return f(w*d+n,d)}function gen(i){const stage=Math.floor(i/5);let d1,d2,w1,w2,n1,n2,op;let tries=0;do{tries++;d1=rand(2,stage<2?8:9);d2=stage<2?d1:rand(2,9);n1=rand(1,d1-1);n2=rand(1,d2-1);w1=rand(1,stage<4?4:6);w2=rand(1,stage<4?3:5);op=stage===0||stage===2?'+':stage===1||stage===3?'-':rand(0,1)?'+':'-';const a=mixed(w1,n1,d1),b=mixed(w2,n2,d2);const numer=op==='+'?a.n*b.d+b.n*a.d:a.n*b.d-b.n*a.d;const den=a.d*b.d;const result=f(numer,den);const carry=(n1/d1+n2/d2)>=1,borrow=(n1/d1<n2/d2);if(numer>0&&(stage!==4||(op==='+'?carry:borrow))){return {w1,n1,d1,w2,n2,d2,op,result}}}while(tries<500);return {w1:2,n1:1,d1:2,w2:1,n2:1,d2:3,op:'+',result:f(23,6)}}
function formatFrac(fr){let w=Math.floor(fr.n/fr.d),n=fr.n%fr.d;return w+(n?` ${n}/${fr.d}`:'')}function htmlMixed(w,n,d){return `<span class="mixed">${w}<span class="frac"><span>${n}</span><span>${d}</span></span></span>`}function htmlResult(fr){const w=Math.floor(fr.n/fr.d),n=fr.n%fr.d;return n?htmlMixed(w,n,fr.d):String(w)}function same(a,b){return a.n*b.d===b.n*a.d}function level(){return Math.min(5,Math.floor(index/5))}function showHero(l){$('hero').textContent=heroes[l][0];$('heroName').textContent=heroes[l][1];$('gear').textContent='장비: '+heroes[l][2];$('level').textContent='레벨 '+(l+1)}
function generateChoices(q){const opts=[q.result];let tries=0;while(opts.length<4&&tries++<150){const delta=rand(-5,5);if(!delta)continue;const candidate=f(q.result.n+delta,q.result.d);if(candidate.n>0&&!opts.some(v=>same(v,candidate)))opts.push(candidate)}while(opts.length<4){const candidate=f(q.result.n+rand(1,10),q.result.d);if(!opts.some(v=>same(v,candidate)))opts.push(candidate)}for(let i=opts.length-1;i>0;i--){const j=rand(0,i);[opts[i],opts[j]]=[opts[j],opts[i]]}return opts}
function render(){locked=false;attempt=0;$('play').classList.remove('hidden');$('levelUp').classList.add('hidden');$('finish').classList.add('hidden');$('count').textContent=`${index} / 30 완료`;$('bar').style.width=(index/30*100)+'%';showHero(level());const q=questions[index];$('questLabel').textContent=`퀘스트 ${index+1} · ${q.op==='+'?'덧셈':'뺄셈'} · ${index<15?'4지선다':'직접 입력'}`;$('equation').innerHTML=`${htmlMixed(q.w1,q.n1,q.d1)} <span>${q.op}</span> ${htmlMixed(q.w2,q.n2,q.d2)} <span>= ?</span>`;$('feedback').textContent='';$('hint').textContent='';$('choiceArea').classList.toggle('hidden',index>=15);$('inputArea').classList.toggle('hidden',index<15);$('whole').value='0';$('num').value='';$('den').value='';if(index<15){$('choiceArea').innerHTML='';generateChoices(q).forEach((o,i)=>{const b=document.createElement('button');b.className='btn';b.innerHTML=`${i+1}. ${htmlResult(o)}`;b.onclick=()=>check(same(o,q.result));$('choiceArea').appendChild(b)})}}
function check(ok){if(locked)return;if(!ok){wrong++;attempt++;$('feedback').textContent='💪 아쉬워요! 다시 생각해 보세요.';$('feedback').style.color='#ffb5b5';if(attempt>=2)$('hint').textContent='힌트: 분모를 통분한 뒤 분자끼리 계산하고, 마지막에 약분해 보세요.';return}locked=true;$('feedback').textContent='🎉 정답! +100 XP';$('feedback').style.color='#9cf3bd';$('hint').textContent='';setTimeout(()=>{index++;$('count').textContent=`${index} / 30 완료`;$('bar').style.width=(index/30*100)+'%';if(index===30){finish();return}if(index%5===0){upgrade();return}render()},650)}
function upgrade(){const l=level();$('play').classList.add('hidden');$('levelUp').classList.remove('hidden');$('levelUpHero').textContent=heroes[l][0];$('levelUpName').textContent=heroes[l][1];$('levelUpText').textContent=`축하합니다! ${heroes[l][2]}을(를) 획득했습니다.`;showHero(l)}function finish(){$('play').classList.add('hidden');$('finish').classList.remove('hidden');showHero(5);$('level').textContent='최종 레벨 6';const secs=Math.floor((Date.now()-start)/1000);$('stats').innerHTML=`완료 문제: 30 / 30<br>오답 시도: ${wrong}회<br>소요 시간: ${Math.floor(secs/60)}분 ${secs%60}초<br>획득 경험치: 3000 XP`}
function reset(){questions=Array.from({length:30},(_,i)=>gen(i));index=0;wrong=0;start=Date.now();render()}
$('submit').onclick=()=>{const w=Number($('whole').value),n=Number($('num').value),d=Number($('den').value);if(!$('whole').value.trim()||!$('num').value.trim()||!$('den').value.trim()||![w,n,d].every(Number.isInteger)||w<0||n<0||d<=0){$('feedback').textContent='자연수·분자·분모에 올바른 숫자를 입력해 주세요.';$('feedback').style.color='#ffb5b5';return}check(same(f(w*d+n,d),questions[index].result))};$('continue').onclick=render;$('restart').onclick=reset;reset();
</script></body></html>
